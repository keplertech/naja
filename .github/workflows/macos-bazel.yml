name: macOS Bazel Build

# Source builds use the same naja-if checkout as CMake. BCR compatibility
# is validated separately by bazel-registered.yml.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-26, macos-15]

    steps:
    - uses: actions/checkout@v7

    - name: Initialize shared source dependency
      run: git submodule update --init thirdparty/naja-if thirdparty/naja-verilog

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}
        repository-cache: true

    - name: Build
      # --jobs=auto: Bazel already parallelizes across all local cores by
      # default (unlike make/CMake's default serial build) -- spelled out
      # explicitly here for clarity/predictability rather than because
      # it's functionally required.
      run: bazel build //... --jobs=auto

    - name: Check netlist determinism
      run: >-
        bazel test //test/najaeda:najaeda_determinism_tests --test_output=errors
        --experimental_ui_max_stdouterr_bytes=10485760

    - name: Test
      run: >-
        bazel test //... --test_output=errors --jobs=auto
        --experimental_ui_max_stdouterr_bytes=10485760

    - name: Upload Bazel test logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: bazel-test-logs-${{ matrix.os }}
        path: |
          bazel-testlogs/**/test.log
          bazel-testlogs/**/test.xml
        if-no-files-found: warn
