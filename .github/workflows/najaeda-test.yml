name: najaeda test, coverage and lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Exercise more allocator / ASLR layouts independently of incoming changes.
    - cron: '23 4 * * 1'

env:
  BUILD_TYPE: Release
  NAJA_INSTALL: ${{ github.workspace }}/naja-install

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev
    - name: Set up canonical Linux Release toolchain
      uses: ./.github/actions/setup-linux-release
      with:
        cache-scope: full
    - name: Configure canonical Release build
      run: bash .github/scripts/configure-linux-release.sh
    - name: Build Naja Release tree
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Check netlist determinism
      env:
        NAJA_DETERMINISM_RUNS: ${{ github.event_name == 'schedule' && '30' || '5' }}
      run: ctest --test-dir build -L determinism --no-tests=error --output-on-failure

    - name: Run Naja test suite
      working-directory: ${{github.workspace}}/build
      run: ctest --parallel $(nproc) -VV -C ${{env.BUILD_TYPE}}
    - name: Install Python test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install "coverage>=7.2"
    - name: Lint Python sources with flake8
      working-directory: ${{github.workspace}}/src/najaeda
      run: flake8 --max-line-length=100 --ignore E128,W504,W503 --exclude docs,examples,native_examples,README
    - name: Run najaeda tests with coverage
      working-directory: ${{github.workspace}}/test/najaeda
      env:
        PYTHONPATH: ${{github.workspace}}/build/test/najaeda
        NAJA_DB0_AUDIT_BINARY: ${{github.workspace}}/build/test/nl/snl/serialization/capnp/snlCapnPTests
        LIBERTY_BENCHMARKS_PATH: ${{github.workspace}}/test/nl/formats/liberty/benchmarks
        VERILOG_BENCHMARKS_PATH: ${{github.workspace}}/test/nl/formats/verilog/benchmarks
        NAJAEDA_TEST_PATH: ${{github.workspace}}/build/test/najaeda
        NAJAEDA_SOURCE_TEST_PATH: ${{github.workspace}}/test/najaeda
      run: |
        python -m coverage run -m unittest && python -m coverage xml --rcfile=./.coveragerc
    - name: Test schematic integration with the optional dependency
      env:
        PYTHONPATH: ${{github.workspace}}/build/test/najaeda
      run: |
        python -m pip install "naja-schematic>=0.1.1"
        python -c "import naja_schematic"
        python -m unittest discover -v -s test/najaeda -p test_najaeda_schematic.py
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: github.repository == 'keplertech/naja' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        directory: ${{github.workspace}}/test/najaeda/
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
