name: SV Unit Test Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sv-unit-test-sim:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev iverilog

    - name: Set up canonical Linux Release toolchain
      uses: ./.github/actions/setup-linux-release
      with:
        cache-scope: naja-module

    - name: Configure canonical Release build
      run: bash .github/scripts/configure-linux-release.sh

    - name: Build najaeda Python extension and HDL simulation tests
      run: cmake --build ${{ github.workspace }}/build --target naja snlSVConstructorTests snlVRLDumperTests --config Release --parallel $(nproc)

    - name: Run HDL tests with required Icarus simulation
      run: |
        command -v iverilog
        command -v vvp
        build/test/nl/formats/systemverilog/frontend/snlSVConstructorTests \
          --gtest_output=xml:build/sv-frontend-tests.xml
        build/test/nl/formats/verilog/backend/snlVRLDumperTests \
          --gtest_output=xml:build/verilog-dumper-tests.xml
        python3 - <<'PYTHON'
        import xml.etree.ElementTree as ET

        for path in ("build/sv-frontend-tests.xml", "build/verilog-dumper-tests.xml"):
            report = ET.parse(path).getroot()
            skipped = report.findall(".//testcase[skipped]")
            if skipped:
                names = [f"{case.get('classname')}.{case.get('name')}" for case in skipped]
                raise SystemExit(f"{path}: tests must not skip: " + ", ".join(names))
            if int(report.get("tests", "0")) == 0:
                raise SystemExit(f"{path}: no tests ran")
            print(f"{path}: all {report.get('tests')} tests ran without skips")
        PYTHON

    - name: Prepare najaeda Python package for script execution
      run: |
        mkdir -p ${{ github.workspace }}/build/test/najaeda
        cp -R ${{ github.workspace }}/src/najaeda/najaeda ${{ github.workspace }}/build/test/najaeda/
        ln -sf ${{ github.workspace }}/build/src/nl/python/naja_wrapping/naja.so \
          ${{ github.workspace }}/build/test/najaeda/najaeda/naja.so

    - name: Generate Verilog from SystemVerilog with najaeda
      env:
        PYTHONPATH: ${{ github.workspace }}/build/test/najaeda
      run: |
        python3 ${{ github.workspace }}/test/nl/formats/systemverilog/benchmarks/generate_najaeda_verilog.py

    # streaming_lhs is tested as a Naja dump below: Verilator disagrees with
    # Slang constant evaluation on partial streaming slices and target swaps.
    - name: Simulate SV benchmarks
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          --entrypoint /bin/bash \
          verilator/verilator:v5.046 \
          -c 'set -euo pipefail
              cd /work/test/nl/formats/systemverilog/benchmarks
              for bench in \
                latch_loops \
                compound_shifts \
                simple \
                up_counter \
                param_inst \
                binary_ops_supported \
                byte_ports \
                implicit_width_ports \
                port_directions \
                non_ansi_ports \
                model_reuse \
                unary_not \
                unary_not_binary_supported \
                seq_add_out_plus_one \
                seq_add_one_plus_out \
                seq_enable_else_default \
                seq_enable_bus1_supported \
                seq_preincrement_supported \
                seq_reset_only_supported \
                seq_reset_all_zero_literal_wide_supported \
                seq_list_single_wrapper_supported \
                seq_nested_begin_wrapper_supported \
                seq_concurrent_assertion_ignored \
                seq_timing_event_list_negedge_reset_supported \
                seq_binary_non_add \
                seq_add_non_increment \
                seq_rhs_unresolved \
                seq_rhs_width_mismatch \
                seq_rhs_direct_match \
                packed_struct_enum_ports \
                fixed_unpacked_array_variable \
                unsupported_generic_type; do
                make -C "$bench" clean
                make -C "$bench" sim
              done'

    - name: Simulate generated Verilog benchmarks
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          --entrypoint /bin/bash \
          verilator/verilator:v5.022 \
          -c 'set -euo pipefail
              cd /work/test/nl/formats/systemverilog/benchmarks
              primitives_sv=../najaeda_primitives.v
              for bench in \
                latch_loops \
                compound_shifts \
                streaming_lhs \
                simple \
                up_counter \
                param_inst \
                binary_ops_supported \
                byte_ports \
                implicit_width_ports \
                port_directions \
                non_ansi_ports \
                model_reuse \
                unary_not \
                unary_not_binary_supported \
                seq_add_out_plus_one \
                seq_add_one_plus_out \
                seq_enable_else_default \
                seq_enable_bus1_supported \
                seq_preincrement_supported \
                seq_reset_only_supported \
                seq_reset_all_zero_literal_wide_supported \
                seq_list_single_wrapper_supported \
                seq_nested_begin_wrapper_supported \
                seq_timing_event_list_negedge_reset_supported \
                seq_rhs_direct_match \
                packed_struct_enum_ports; do
                generated_sv="${bench}_naja.v"
                make -C "$bench" clean
                make -C "$bench" sim SV="$generated_sv $primitives_sv"
              done'

    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
