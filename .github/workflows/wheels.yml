name: najaeda Wheel builder

on:
  # Save CI by only running this on release branches or tags.
  push:
    branches:
      - main
    tags:
      - v*
  # Also run this action on PRs.
  pull_request:
  # Manual run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate-parser:
    concurrency:
      group: "parser-generation-${{ github.run_id }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      artifact_name: parser-generated-sources
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install flex & bison
        run: |
          sudo apt-get update && sudo apt-get install -yq libfl-dev

      - name: Generate parser sources
        run: |
          cd thirdparty/naja-verilog
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel $(nproc)
          mkdir -p ../../generated
          cp -v build/src/VerilogParser.cpp build/src/VerilogParser.hpp build/src/VerilogScanner.cpp ../../generated
          cp -v build/src/*.hh ../../generated
          cp -v /usr/include/FlexLexer.h ../../generated

      - name: Upload parser artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parser-generated-sources
          path: generated/*

  build_wheels:
    needs: generate-parser
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ matrix.manylinux_image }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux wheels: use manylinux_2_28 for a modern C++20 toolchain
          - os: ubuntu-latest
            python: 310
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 311
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 312
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 313
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 314
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 314t
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28
          - os: ubuntu-latest
            python: 315
            platform_id: manylinux_x86_64
            manylinux_image: manylinux_2_28

          - os: ubuntu-24.04-arm
            python: 310
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64
          - os: ubuntu-24.04-arm
            python: 311
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64
          - os: ubuntu-24.04-arm
            python: 312
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64
          - os: ubuntu-24.04-arm
            python: 313
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64
          - os: ubuntu-24.04-arm
            python: 314
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64
          - os: ubuntu-24.04-arm
            python: 315
            platform_id: manylinux_aarch64
            manylinux_image: manylinux_2_28
            cibw_arch: aarch64

          # MacOS arm64
          - os: macos-15
            python: 310
            platform_id: macosx_arm64
          - os: macos-15
            python: 311
            platform_id: macosx_arm64
          - os: macos-15
            python: 312
            platform_id: macosx_arm64
          - os: macos-15
            python: 313
            platform_id: macosx_arm64
          - os: macos-15
            python: 314
            platform_id: macosx_arm64
          - os: macos-15
            python: 314t
            platform_id: macosx_arm64
          - os: macos-15
            python: 315
            platform_id: macosx_arm64

          # Windows x86_64 wheels
          - os: windows-latest
            python: 310
            platform_id: win_amd64
          - os: windows-latest
            python: 311
            platform_id: win_amd64
          - os: windows-latest
            python: 312
            platform_id: win_amd64
          - os: windows-latest
            python: 313
            platform_id: win_amd64
          - os: windows-latest
            python: 314
            platform_id: win_amd64
          - os: windows-latest
            python: 315
            platform_id: win_amd64

    steps:
      # build steps
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download parser-generated sources
        # if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: parser-generated-sources
          path: generated
      - name: Install generated parser sources into tree
        #if: runner.os == 'Windows'
        run: |
          echo "Copying generated parser files into thirdparty/naja-verilog/src"
          cp -R generated thirdparty/naja-verilog/src/

      - name: Configure macOS Environment
        if: runner.os == 'macOS'
        run: |
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_ENV_HINTS=1
            eval "$(brew shellenv)"
            brew install -q boost
      - name: Install cibuildwheel (and delvewheel for Windows)
        run: python -m pip install cibuildwheel==4.2.1 delvewheel
      - name: Configure Windows dependency cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite"
          Add-Content $env:GITHUB_ENV "VCPKG_CACHE_IMAGE=$env:ImageOS-$env:ImageVersion"
      - name: Restore Windows dependency cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          # Share native dependencies across Python versions; refresh on runner
          # image updates so a new compiler can populate its own cache.
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_CACHE_IMAGE }}-${{ hashFiles('ci/windows_setup.ps1') }}
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/windows_setup.ps1
      - name: Save Windows dependency cache
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build wheels
        env:
          CIBW_ENVIRONMENT: SKLEARN_SKIP_NETWORK_TESTS=1
          CIBW_ENVIRONMENT_MACOS: >-
            SKLEARN_SKIP_NETWORK_TESTS=1
            MACOSX_DEPLOYMENT_TARGET=11.0
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_ARCHS: 'all'
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_I686_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_BEFORE_BUILD_WINDOWS: "pwsh -Command \"foreach($d in 'build','dist'){ if(Test-Path $d){ Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue } }\""
          # Keep the native audit executable available to the installed-wheel tests.
          CIBW_CONFIG_SETTINGS: >-
            build-dir=build/wheel
            cmake.define.BUILD_NAJA_SERIALIZATION_TESTS=ON
          CIBW_CONFIG_SETTINGS_WINDOWS: >
            build-dir=build/wheel
            cmake.define.BUILD_NAJA_SERIALIZATION_TESTS=ON
            cmake.define.gtest_force_shared_crt=ON
            cmake.args=-DCMAKE_TOOLCHAIN_FILE=C:/Users/runneradmin/vcpkg/scripts/buildsystems/vcpkg.cmake
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair -v
            --ignore-existing
            --analyze-existing
            --include-imports
            --add-path "C:\Users\runneradmin\vcpkg\installed\x64-windows\bin"
            -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >
            bash -c '
              set -ex
              export PYTHONPATH=""
              python {project}/ci/check_wheel_import.py

              export VERILOG_BENCHMARKS_PATH="{project}/test/nl/formats/verilog/benchmarks"
              export SYSTEMVERILOG_BENCHMARKS_PATH="{project}/test/nl/formats/systemverilog/benchmarks"
              export LIBERTY_BENCHMARKS_PATH="{project}/test/nl/formats/liberty/benchmarks"
              export NAJAEDA_TEST_PATH="{project}/test/najaeda"
              export NAJAEDA_SOURCE_TEST_PATH="{project}/test/najaeda"
              export NAJA_DB0_AUDIT_BINARY="$(cat "{project}/build/wheel/db0_audit_binary_Release.txt")"
              test -x "$NAJA_DB0_AUDIT_BINARY"

              python -m pytest {project}/test/najaeda

              cd {project}/src/najaeda/examples
              python run_regress.py > run_regress.log

              cd {project}/src/najaeda/native_examples
              python run_regress.py > run_native_regress.log
            '
          CIBW_TEST_COMMAND_WINDOWS: >
            pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {project}\ci\windows_test.ps1
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Verify macOS wheel compatibility tag
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels found in wheelhouse/"
            exit 1
          fi

          unexpected=0
          for wheel in "${wheels[@]}"; do
            filename="$(basename "$wheel")"

            if [[ "$filename" != *macosx_11_0_arm64.whl ]]; then
              echo "Unexpected macOS wheel tag (expected macosx_11_0_arm64): $filename"
              unexpected=1
            fi

            if [[ "$filename" =~ macosx_([0-9]+)_([0-9]+)_arm64 ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              if (( major > 11 || (major == 11 && minor > 0) )); then
                echo "Unsupported macOS baseline tag detected (>=12.0): $filename"
                unexpected=1
              fi
            fi
          done

          if [ "$unexpected" -ne 0 ]; then
            echo "macOS wheel compatibility check failed."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-cp${{ matrix.python }}-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: generate-parser
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq libboost-dev capnproto libcapnp-dev libtbb-dev ninja-build

      - name: Download parser-generated sources
        uses: actions/download-artifact@v8
        with:
          name: parser-generated-sources
          path: generated

      - name: Install generated parser sources into tree
        run: |
          echo "Copying generated parser files into thirdparty/naja-verilog/src"
          cp -R generated thirdparty/naja-verilog/src/

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Verify source distribution
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python -m pip install --force-reinstall sdist-wheel/*.whl
          python ci/check_wheel_import.py

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz


  test_upload_pypi:
    if: github.repository == 'keplertech/naja' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    #environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi-publish:
    if: github.repository == 'keplertech/naja' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test_upload_pypi]
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
