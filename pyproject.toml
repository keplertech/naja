[build-system]
requires = ["scikit-build-core>=0.11.3,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "najaeda"
description = "Python package for elaborating, navigating, analyzing, and editing hardware designs"
authors = [{name = "Naja Authors", email = "contact@keplertech.io"}]
readme = "src/najaeda/README.rst"
requires-python = ">=3.10"
license = {text = "Apache License 2.0"}
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]

[project.optional-dependencies]
schematic = ["naja-schematic>=0.1.1"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE="Release"
BUILD_NAJA_PYTHON="ON"

[tool.scikit-build.sdist]
include = [
    "thirdparty/naja-verilog/src/generated/VerilogParser.cpp",
    "thirdparty/naja-verilog/src/generated/VerilogParser.hpp",
    "thirdparty/naja-verilog/src/generated/VerilogScanner.cpp",
    "thirdparty/naja-verilog/src/generated/*.hh",
    "thirdparty/naja-verilog/src/generated/FlexLexer.h",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/core/NajaVersion.h.in"
regex = 'NAJA_VERSION\s*\{\s*"(?P<value>[^"]+)"\s*\}'

[project.urls]
Homepage = "https://github.com/keplertech/naja"
Repository = "https://github.com/keplertech/naja"
Issues = "https://github.com/keplertech/naja/issues"

[tool.cibuildwheel]
build-verbosity = 1

[tool.cibuildwheel.macos]
build-frontend = "build"
before-build = "rm -rf build dist"
before-all = '''
  brew install cmake
  echo "::group::Installing capnproto"
  curl --retry 5 --retry-delay 5 -fsSLo capnproto-c++-1.1.0.tar.gz https://capnproto.org/capnproto-c++-1.1.0.tar.gz
  tar -xzf capnproto-c++-1.1.0.tar.gz
  cd capnproto-c++-1.1.0
  ./configure
  make -j6
  sudo make install
  echo "::endgroup::"
  cd ..

  echo "::group::Installing TBB"
  curl --retry 5 --retry-delay 5 -fsSLo v2022.1.0.tar.gz https://github.com/oneapi-src/oneTBB/archive/refs/tags/v2022.1.0.tar.gz
  tar -xzf v2022.1.0.tar.gz
  mkdir TBB_build
  cd TBB_build
  cmake ../oneTBB-2022.1.0 -DCMAKE_BUILD_TYPE=Release -DTBB_TEST=OFF
  make -j6
  sudo make install
  echo "::endgroup::"
  cd ..
'''

[tool.cibuildwheel.linux]
build-frontend = "build"
before-all = '''
  set -euo pipefail
  echo "::group::Installing dependencies"
  # Use official AlmaLinux repositories to avoid inconsistent mirror metadata.
  # Only BaseOS and AppStream are needed; unrelated EPEL failures must not block us.
  for attempt in 1 2 3; do
    yum clean all
    if yum -y --refresh --disablerepo='*' --enablerepo=baseos,appstream \
      --setopt=baseos.mirrorlist= \
      --setopt='baseos.baseurl=https://repo.almalinux.org/almalinux/$releasever/BaseOS/$basearch/os/' \
      --setopt=appstream.mirrorlist= \
      --setopt='appstream.baseurl=https://repo.almalinux.org/almalinux/$releasever/AppStream/$basearch/os/' \
      install curl boost-devel; then
      break
    fi
    if [ "$attempt" -eq 3 ]; then
      echo "Dependency installation failed after $attempt attempts" >&2
      exit 1
    fi
    sleep 10
  done
  echo "::endgroup::"

  echo "::group::Installing TBB"
  curl --retry 5 --retry-delay 5 -fsSLo v2022.1.0.tar.gz https://github.com/oneapi-src/oneTBB/archive/refs/tags/v2022.1.0.tar.gz
  tar -xzf v2022.1.0.tar.gz
  mkdir TBB_build
  cd TBB_build
  cmake ../oneTBB-2022.1.0 -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DTBB_TEST=OFF
  make -j$(nproc)
  make install
  echo "::endgroup::"
  cd ..
  echo "::group::Installing capnproto"
  curl --retry 5 --retry-delay 5 -fsSLo capnproto-c++-1.1.0.tar.gz https://capnproto.org/capnproto-c++-1.1.0.tar.gz
  tar -xzf capnproto-c++-1.1.0.tar.gz
  cd capnproto-c++-1.1.0
  ./configure
  make -j$(nproc)
  make install
  echo "::endgroup::"
  cd ..
'''
