  # CHERIoT Ibex (lowRISC/ibex) RTL against its Naja netlist: random-stimulus
  # lockstep co-simulation of six parameter configurations (default, PMP, ICache,
  # CHERIoT, RV32B, full opentitan), plus a determinism check (two loads must
  # dump identical netlists). See cases/ibex_cheriot/ibex_cosim.py.
  - name: ibex_cheriot
    repo: https://github.com/lowRISC/ibex.git
    commit: 7a4697f578c67c550fcad5e5e3078415e1f088d7
    top: ibex_top
    flist: "{naja}/regress/sv/cases/ibex_cheriot/ibex_top.f"
    output: ibex_cheriot_naja.v
    verilator:
      image: verilator/verilator:v5.046
      timeout_seconds: 3600
    ibex_cosim:
      timeout_seconds: 3600
      tool_checks:
        - verilator
        - c++
      commands:
        - - python3
          - "{naja}/regress/sv/cases/ibex_cheriot/ibex_cosim.py"
          - "--repo"
          - "{repo}"
          - "--artifacts"
          - "{artifacts}"
          - "--najaeda-pythonpath"
          - "{naja}/build/test/najaeda"
          - "--rtl-cache"
          - "{work}/ibex-cosim-rtl-cache"
      pass_regex: "IBEX_COSIM_PASS"

