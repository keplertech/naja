  - name: cva6
    repo: https://github.com/xtofalex/cva6.git
    commit: bead12b083b4457a1ae87b8b9c8812a9d64bfc54
    top: cva6
    flist: core/Flist.cva6
    output: cva6_naja.v
    env:
      CVA6_REPO_DIR: "{repo}"
      HPDCACHE_DIR: "{repo}/core/cache_subsystem/hpdcache"
      TARGET_CFG: cv64a6_imafdc_sv39
    dump:
      rtl_infos_as_attributes: true
    # Structural integration signatures are intentionally tied to the pinned
    # CVA6 commit above. Update these counts only after reviewing the cone diff.
    # Shared index decoding removes 42 XNOR and 20 AND gates (82 edges);
    # cone boundary counts and the individual-bit probes remain unchanged.
    logic_cones:
      - term: noc_req_o
        direction: fanin
        expected:
          nodes: 1633
          edges: 2316
          leaves: 19
          roots: 471
          registers: 16
          ports: 3
          blackboxes: 0
          internal: 1143
      - term: noc_req_o
        bit: 468
        direction: fanin
        expected:
          nodes: 3
          edges: 2
          leaves: 0
          roots: 1
          registers: 0
          ports: 0
          blackboxes: 0
          internal: 2
      - term: noc_req_o
        bit: 469
        direction: fanin
        expected:
          nodes: 3
          edges: 2
          leaves: 0
          roots: 1
          registers: 0
          ports: 0
          blackboxes: 0
          internal: 2
    verilator:
      image: verilator/verilator:v5.046
      timeout_seconds: 7200
      suppressions:
        - ASCRANGE

  # CVA6 'ariane' synthesizable DUT — Path B simulation target.
  #
  # ariane is the correct Naja top: it is the synthesizable processor that
  # ariane_testharness wraps.  The testbench (ariane_testharness + SimDTM +
  # SimJTAG + rvfi_tracer + peripherals) is the VERIFICATION ENVIRONMENT — it
  # stays unmodified and wraps the Naja-generated ariane netlist at sim time.
  # Loading ariane_testharness in Naja would bring in simulation-only constructs
  # (DPI calls, string variables) that are not representable in SNL.
  #
  # Pattern: identical to ibex (top: ibex_top, tb: ariane_testharness wraps DUT).
  # CVA6 'cva6' DUT for Path B simulation.
  #
  # ariane.sv defaults to config_pkg::cva6_cfg_empty (all-zeros) — using it
  # as the top would give CVA6Cfg.XLEN=0 and cause Slang elaboration errors.
  # cva6.sv defaults to build_config(cva6_config_pkg::cva6_cfg) which IS a
  # concrete 64-bit config that Slang can evaluate → top: cva6 is correct.
  #
  # Simulation model (helloworld_sim):
  #   ariane_testharness.sv (unchanged) + ariane.sv + SoC files + cva6_naja.v
  #   → replaces cva6.sv with the Naja netlist in the testbench hierarchy
  - name: cva6_testharness
    repo: https://github.com/xtofalex/cva6.git
    commit: bead12b083b4457a1ae87b8b9c8812a9d64bfc54
    top: cva6
    flist: core/Flist.cva6
    output: cva6_testharness_naja.v
    env:
      CVA6_REPO_DIR: "{repo}"
      HPDCACHE_DIR: "{repo}/core/cache_subsystem/hpdcache"
      TARGET_CFG: cv64a6_imafdc_sv39
    dump:
      rtl_infos_as_attributes: true
    verilator:
      image: verilator/verilator:v5.046
      timeout_seconds: 7200
      suppressions:
        - ASCRANGE
        - TIMESCALEMOD
    helloworld_sim:
      timeout_seconds: 14400
      tool_checks:
        - verilator
        - make
        - spike
        - - riscv64-unknown-elf-gcc
          - riscv-none-elf-gcc
          - riscv32-unknown-elf-gcc
        - - riscv64-unknown-elf-objcopy
          - riscv-none-elf-objcopy
          - riscv32-unknown-elf-objcopy
        - - riscv64-unknown-elf-nm
          - riscv-none-elf-nm
          - riscv32-unknown-elf-nm
      commands:
        - - python3
          - "{naja}/regress/sv/cases/cva6/cva6_testharness.py"
          - "--repo"
          - "{repo}"
          - "--artifacts"
          - "{artifacts}"
          - "--generated"
          - "{artifacts}/cva6_testharness_naja.v"
          - "--primitives"
          - "{artifacts}/naja_primitives.v"
      pass_regex: "CVA6_HELLOWORLD_SIM_PASS"
    cva6_extended_sim:
      timeout_seconds: 21600
      tool_checks:
        - verilator
        - make
        - spike
        - - riscv64-unknown-elf-gcc
          - riscv-none-elf-gcc
          - riscv32-unknown-elf-gcc
        - - riscv64-unknown-elf-objcopy
          - riscv-none-elf-objcopy
          - riscv32-unknown-elf-objcopy
        - - riscv64-unknown-elf-nm
